$color = rgba(0, 0, 14, 1)
$inner_color = rgba(0, 0, 14, 0.66)
$outer_color = rgba(179, 136, 255, 1)
$font_color = rgba(199, 239, 227, 1)
$placeholder_color = rgba(199, 239, 227, 0.7)
$check_color = rgba(0, 207, 232, 1)

# 12-Hour Clock at the top
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    color = $font_color
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
}

# Date label below the clock
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = $placeholder_color
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 1
}

# Smaller password field with subtle rounded corners
input-field {
    monitor =
    size = 280, 48
    position = 0, -20
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = <span>Enter Password 󰈷</span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 10
    shadow_passes = 1
    fade_on_empty = false
}
