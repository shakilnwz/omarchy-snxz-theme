# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(7186fd)
$activeShadowColor = rgb(8496fd)
$inactiveBorderColor = rgba(00000eba)
$inactiveShadowColor = rgba(00000ea6)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    # Use master layout instead of dwindle
    layout = scrolling
    # allow_tearing = true
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        vibrancy = 0.2
        ignore_opacity = false
      }
      shadow {
          enabled = true
          range = 16
          render_power = 4
          color = $activeShadowColor
          color_inactive = $inactiveShadowColor
        }
  }

# Makes keepassxc float
windowrule {
    name = keepass-window
        match:class = org.keepassxc.KeePassXC
        float = true
        pin = true
}

windowrule {
    name = floating-window
        match:float = true
        border_size = 2
        rounding = 4
        # border_color = rgba(518a51ee)
        center = true
}

windowrule {
    name = modal-window
        match:modal = true
        border_size = 2
        rounding = 4
        # border_color = rgba(518a51ee)
        float = true
        center = true
}

# Config For scrolling and overview plugin
scrolling {
    fullscreen_on_one_column = true
    column_width = 1
    focus_fit_method = 1
    follow_focus = true
    follow_min_visible = 0.1
}

# Custom Keybinds
# This will only work after clearing out the default packages

bindd = SUPER ALT, RETURN, Herdr, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" zsh -c "herdr"
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT ALT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, O, Vnote, exec, uwsm-app -- xdg-terminal-exec zsh -c ~/.config/omarchy/current/theme/bin/vnote
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- KeePassXC
bindd = SUPER, BACKSLASH, Herdr, exec, uwsm-app -- xdg-terminal-exec zsh -c ~/.config/omarchy/current/theme/bin/herdr-sessionizer
bindd = SUPER SHIFT, BACKSLASH, Tmux, exec, uwsm-app -- xdg-terminal-exec zsh -c ~/.config/omarchy/current/theme/bin/tmux-sessionizer
bindd = , F7, Cycle display, exec, ~/.config/omarchy/current/theme/bin/cycle-display

# Move active window with SUPER + SHIFT + arrow keys

bindd = SUPER SHIFT, LEFT, Move window left, movewindow, l
bindd = SUPER SHIFT, RIGHT, Move window right, movewindow, r
bindd = SUPER SHIFT, UP, Move window up, movewindow, u
bindd = SUPER SHIFT, DOWN, Move window down, movewindow, d

# Move focus with SUPER + mouse scroll wheel
bindd = SUPER, mouse_up, Focus left window, movefocus, l
bindd = SUPER, mouse_down, Focus right window, movefocus, r

# Gestures: 3-finger swipe to move focus between windows (workspace-agnostic & monitor-aware, natural scrolling)
gesture = 3, left, dispatcher, movefocus, r
gesture = 3, right, dispatcher, movefocus, l
gesture = 3, up, dispatcher, movefocus, u
gesture = 3, down, dispatcher, movefocus, d

# 4-finger horizontal swipe to switch workspaces
gesture = 4, horizontal, workspace

# Monitor Setup
# External 1920x1080 display (HDMI-A-1) on top of the laptop display (60Hz, 1x scale)
monitor = HDMI-A-2, 1920x1080@60, auto-up, 1
monitor = eDP-1, 1920x1080@60, auto, 1
